name: Notificações do Sistema
on:
  schedule:
    - cron: "40 10 * * *"   # 07:40 em São Paulo
    - cron: "30 23 * * *"   # 20:30 em São Paulo
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar notificação
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'fdd-vitor-c464ff03bb56' }}
          APP_URL: https://vitordbl.github.io/fisico-dos-deuses/
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/notificar.py
      - name: Manter o agendamento ativo
        if: ${{ github.event.schedule == '40 10 * * *' }}
        run: |
          d=$(date -u +%d)
          if [ "$d" = "01" ]; then
            date -u > .keepalive
            git config user.name "sistema-bot"; git config user.email "sistema-bot@users.noreply.github.com"
            git add .keepalive && git commit -m "manter agendamento ativo" && git push || true
          fi
