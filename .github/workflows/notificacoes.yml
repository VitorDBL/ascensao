name: Notificações do Sistema
on:
  schedule:
    - cron: "17 16 * * *"   # 13h17 em São Paulo: agenda no ntfy a noite de hoje e a manhã de amanhã
  workflow_dispatch:
    inputs:
      modo:
        description: "agora = manda o bom dia de hoje na hora; agendar = agenda noite e manhã"
        default: agendar
permissions:
  contents: write
jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar ou agendar notificações
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'fdd-vitor-c464ff03bb56' }}
          APP_URL: https://vitordbl.github.io/fisico-dos-deuses/
          MODO: ${{ github.event.inputs.modo || 'agendar' }}
        run: python3 scripts/notificar.py
      - name: Manter o agendamento ativo
        if: ${{ github.event_name == 'schedule' }}
        run: |
          d=$(date -u +%d)
          if [ "$d" = "01" ]; then
            date -u > .keepalive
            git config user.name "sistema-bot"; git config user.email "sistema-bot@users.noreply.github.com"
            git add .keepalive && git commit -m "manter agendamento ativo" && git push || true
          fi
